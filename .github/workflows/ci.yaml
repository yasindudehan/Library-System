name: Spring Boot CI

on:  
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build and test
        run: mvn -B verify
 